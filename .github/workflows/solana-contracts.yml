name: Solana contract source checks
on:
  push:
    paths: ['contracts/solana/programs/**', 'contracts/solana/tests/**', 'contracts/solana/tools/**', 'contracts/solana/Cargo.*', 'contracts/solana/Anchor.toml', 'pilot-site/package*.json', 'pilot-site/worker/meteora-*', 'pilot-site/tests/meteora-*', 'pilot-site/scripts/generate-meteora-layout.mjs', '.github/workflows/solana-contracts.yml']
  pull_request:
    paths: ['contracts/solana/programs/**', 'contracts/solana/tests/**', 'contracts/solana/tools/**', 'contracts/solana/Cargo.*', 'contracts/solana/Anchor.toml', 'pilot-site/package*.json', 'pilot-site/worker/meteora-*', 'pilot-site/tests/meteora-*', 'pilot-site/scripts/generate-meteora-layout.mjs', '.github/workflows/solana-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/solana/.ci-cache
          key: orakt-solana-tools-1.95-4.4-1.57-v3-agave4-${{ hashFiles('contracts/solana/Cargo.lock') }}
          restore-keys: orakt-solana-tools-1.95-4.4-1.57-v3-agave4-
      - name: Compile program and run host unit tests (NOT validator tests)
        working-directory: contracts/solana
        run: cargo test --workspace --locked
      - name: Compile release library (NOT SBF deployment binary)
        working-directory: contracts/solana
        run: cargo build --workspace --release --locked
      - name: Attempt SBF and IDL build using the official pinned Anchor image
        run: |
          mkdir -p contracts/solana/.ci-cache
          docker run --rm -v "$PWD/contracts/solana:/work" -v "$PWD/contracts/solana/.ci-cache:/cache" -w /work solanafoundation/anchor@sha256:21ab8a16e19df4301a198d7a55ab2988549aa2d996e6b5ad229c1d95b9f2d326 bash -ec '
            bash tests/build-v3.sh
          '
      - name: Install locked JavaScript test client (no package lifecycle scripts)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts --prefix pilot-site
      - name: Execute local-validator provenance and permission tests (no public chain)
        run: |
          node --test contracts/solana/tests/payment-fixtures.test.mjs
          node contracts/solana/tests/start-validator.mjs
          node contracts/solana/tests/runtime.mjs
      - name: Execute stablecoin payment and rollback tests (synthetic local balances only)
        run: node contracts/solana/tests/payments.mjs
      - name: Verify checkout, recovery and wallet binding (no public chain)
        run: node --test pilot-site/tests/protocol-checkout.test.mjs pilot-site/tests/protocol-receipt.test.mjs pilot-site/tests/protocol-security-v145.test.mjs pilot-site/tests/account-wallet.test.mjs
      - name: Verify read-only Meteora decoder against official SDK and retained public fixture
        run: node --test pilot-site/tests/meteora-reader.test.mjs
      - name: Verify migration rehearsal and read-only inspection guards (no public RPC)
        run: node --test contracts/solana/tests/migration-preflight.test.mjs contracts/solana/tests/devnet-readiness.test.mjs
      - name: Stop disposable validator
        if: always()
        run: docker stop orakt-validator || true
      - name: Retain build evidence, never signing keypairs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orakt-contract-build-evidence
          path: |
            contracts/solana/Cargo.lock
            contracts/solana/target/idl/*.json
            contracts/solana/target/deploy/*.so
          if-no-files-found: ignore
          retention-days: 7
