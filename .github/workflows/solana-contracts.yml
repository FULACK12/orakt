name: Solana contract source checks
on:
  push:
    paths: ['contracts/solana/programs/**', 'contracts/solana/tests/**', 'contracts/solana/Cargo.*', 'contracts/solana/Anchor.toml', '.github/workflows/solana-contracts.yml']
  pull_request:
    paths: ['contracts/solana/programs/**', 'contracts/solana/tests/**', 'contracts/solana/Cargo.*', 'contracts/solana/Anchor.toml', '.github/workflows/solana-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/solana/.ci-cache
          key: orakt-solana-tools-1.95-4.4-1.57-v1-${{ hashFiles('contracts/solana/Cargo.lock') }}
          restore-keys: orakt-solana-tools-1.95-4.4-1.57-v1-
      - name: Compile program and run host unit tests (NOT validator tests)
        working-directory: contracts/solana
        run: cargo test --workspace --locked
      - name: Compile release library (NOT SBF deployment binary)
        working-directory: contracts/solana
        run: cargo build --workspace --release --locked
      - name: Attempt SBF and IDL build using the official pinned Anchor image
        run: |
          mkdir -p contracts/solana/.ci-cache
          docker run --rm -v "$PWD/contracts/solana:/work" -v "$PWD/contracts/solana/.ci-cache:/cache" -w /work solanafoundation/anchor@sha256:21ab8a16e19df4301a198d7a55ab2988549aa2d996e6b5ad229c1d95b9f2d326 bash -ec '
            rustup toolchain install 1.95.0 --profile minimal
            rustup default 1.95.0
            if [ ! -x /cache/bin/cargo-build-sbf ]; then cargo install cargo-build-sbf --version 4.4.0 --locked --root /cache; fi
            /cache/bin/cargo-build-sbf --manifest-path programs/orakt-protocol/Cargo.toml --tools-version v1.57 --arch v0 -- --locked
            mkdir -p target/idl
            anchor idl build --out target/idl/orakt_protocol.json
          '
      - name: Install locked JavaScript test client (no package lifecycle scripts)
        run: npm ci --ignore-scripts --prefix pilot-site
      - name: Execute local-validator provenance and permission tests (no public chain)
        run: |
          docker run -d --name orakt-validator -p 127.0.0.1:8899:8899 -p 127.0.0.1:8900:8900 -v "$PWD/contracts/solana:/work" solanafoundation/anchor@sha256:21ab8a16e19df4301a198d7a55ab2988549aa2d996e6b5ad229c1d95b9f2d326 solana-test-validator --bpf-program BaAX5nB9yxMh5K1tdEserFDq7MMcisVGVNshrVNLqDyn /work/target/deploy/orakt_protocol.so --bind-address 0.0.0.0 --ledger /tmp/orakt-test-ledger --quiet
          node contracts/solana/tests/runtime.mjs
      - name: Stop disposable validator
        if: always()
        run: docker stop orakt-validator || true
      - name: Retain build evidence, never signing keypairs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orakt-contract-build-evidence
          path: |
            contracts/solana/Cargo.lock
            contracts/solana/target/idl/*.json
            contracts/solana/target/deploy/*.so
          if-no-files-found: ignore
          retention-days: 7
