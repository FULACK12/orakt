name: Solana contract source checks
on:
  push:
    paths: ['contracts/solana/**', '.github/workflows/solana-contracts.yml']
  pull_request:
    paths: ['contracts/solana/**', '.github/workflows/solana-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile program and run host unit tests (NOT validator tests)
        working-directory: contracts/solana
        run: cargo test --workspace
      - name: Compile release library (NOT SBF deployment binary)
        working-directory: contracts/solana
        run: cargo build --workspace --release
      - name: Attempt SBF and IDL build using the official pinned Anchor image
        run: docker run --rm -v "$PWD/contracts/solana:/work" -w /work solanafoundation/anchor:0.31.1 anchor build
      - name: Retain build evidence, never signing keypairs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: orakt-contract-build-evidence
          path: |
            contracts/solana/Cargo.lock
            contracts/solana/target/idl/*.json
            contracts/solana/target/deploy/*.so
          if-no-files-found: ignore
          retention-days: 7
