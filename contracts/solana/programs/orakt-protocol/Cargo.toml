[package]
name = "orakt-protocol"
version = "0.1.0"
edition = "2021"
publish = false
description = "Unaudited ORAKT provenance and entitlement program; not deployed"

[lib]
crate-type = ["cdylib", "lib"]
name = "orakt_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# Anchor 0.31.1's IDL module references token_interface unconditionally.
# This feature is IDL-only: runtime still accepts Program<Token>, never Token-2022.
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token_2022"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token"] }
